name: core-hardening

# P10-T0-c: mutation + fuzz coverage for ALL FOUR C++ cores.
#
# Why this is a second workflow and not three more governance steps: the
# governance job already carries ~35 min of gates inside a 45-min timeout
# (the P9 budget math; see governance.yml). Adding three sampled mutation
# timeboxes (900 s each) plus a 600 s fuzz fleet would push the sum past any
# honest timeout, and trimming a timebox or a sample to fit is exactly the
# "weaken a gate to keep a lane green" move this repo refuses. So: the
# per-core lanes run here, in parallel jobs, on the pushes that can actually
# change a core (xr-core pin bumps, mutation/fuzz machinery) and weekly, so
# drift is caught even without a touching PR. Policy's lanes stay in
# governance where P6/P8 put them — nothing moved, nothing trimmed.
#
# Runner capability note (P10 research item 8): ubuntu-latest ships a Rust
# and Go toolchain; this workflow needs only python3 + g++ + make, which the
# setup-python action and the image provide.

on:
  push:
    branches: [main]
    paths:
      - "DEPS"
      - "tools/mutation_test.py"
      - "tools/fuzz_fleet.py"
      - "tools/policy_fuzz.py"
      - "tools/mutation_freshness.py"
      - ".github/workflows/core-hardening.yml"
  pull_request:
    paths:
      - "DEPS"
      - "tools/mutation_test.py"
      - "tools/fuzz_fleet.py"
      - "tools/policy_fuzz.py"
      - "tools/mutation_freshness.py"
      - ".github/workflows/core-hardening.yml"
  schedule:
    # weekly, 03:23 UTC Wednesdays — off the :00 stampede
    - cron: "23 3 * * 3"
  workflow_dispatch:

concurrency:
  group: core-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    # The staleness gate first: if a recorded score no longer covers the
    # pin, the per-core jobs below are what re-arms it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Mutation freshness gate
        run: |
          python3 tools/mutation_freshness.py --repo .

  mutation-commands:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # serial fleet: 4 targets x 600 s + three make builds + asserts
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Commands mutation gate (sampled; full = HG-28 farm)
        run: |
          python3 tools/mutation_test.py --targets commands --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 90 --json \
            > /tmp/mutation-commands.json
          cat /tmp/mutation-commands.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-commands.json"))
          assert r["gate"] == "PASS", f"commands mutation gate FAIL: {r['score_pct']}%"
          EOF

  mutation-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Settings mutation gate (sampled; full = HG-28 farm)
        run: |
          python3 tools/mutation_test.py --targets settings --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 90 --json \
            > /tmp/mutation-settings.json
          cat /tmp/mutation-settings.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-settings.json"))
          assert r["gate"] == "PASS", f"settings mutation gate FAIL: {r['score_pct']}%"
          EOF

  mutation-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Themes mutation gate (sampled at the P8 gate, >=95)
        run: |
          python3 tools/mutation_test.py --targets themes --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 95 --json \
            > /tmp/mutation-themes.json
          cat /tmp/mutation-themes.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-themes.json"))
          assert r["gate"] == "PASS", f"themes mutation gate FAIL: {r['score_pct']}% (< 95)"
          EOF

  mutation-update:
    # P10-T1 hard gate: the update verifier core at >=95% killed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Update mutation gate (sampled; >=95 = the T1 hard gate)
        run: |
          python3 tools/mutation_test.py --targets update --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 95 --json \
            > /tmp/mutation-update.json
          cat /tmp/mutation-update.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-update.json"))
          assert r["gate"] == "PASS", f"update mutation gate FAIL: {r['score_pct']}% (< 95)"
          EOF

  server-conformance:
    # P10-T2: the Rust deployable replays the committed corpus byte-exactly
    # (the reference half runs in governance here; no divergence is allowed).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain versions (recorded for research item 8)
        run: |
          cargo --version || echo "SKIP: cargo absent on this runner image"
          rustc --version || echo "SKIP: rustc absent on this runner image"
      - name: Rust conformance (byte parity with the reference corpus)
        run: |
          cd release/server/rust
          cargo test --locked 2>&1 | tee /tmp/rust-conformance.log
          grep -q "test result: ok" /tmp/rust-conformance.log

  shield-vendor:
    # P11-T1: the vendored adblock-rust pin is REAL — it compiles offline
    # from the sha256-sealed tree, and the copy builds with the lock
    # resolved runner-side. Template: P10's server-conformance job.
    # Two-phase on purpose:
    #   build  = OFFLINE against third_party/rust/vendor/ (source
    #            replacement; the CONSUMED-feature closure resolves and
    #            compiles with no network — lock-free resolve, because the
    #            full upstream lock names the css-validation subtree the
    #            closure deliberately excludes; see the step's history
    #            comment — grep-verified, never pipe-exit-verified);
    #   copy   = from a byte-identical COPY (MANIFEST-sealed) with a
    #            runner-side cargo fetch (--locked, release): the vendored
    #            layout deliberately excludes the ~150-crate dev-dep graph
    #            (PROVENANCE.md records the boundary), and the in-tree
    #            source replacement would block dev-dep fetches anyway.
    # NOT `cargo test`: the published .crate tarball carries no upstream
    # test tree — cargo strips tests/ at publish time, and adblock's
    # src/blocker.rs:536 includes ../tests/unit/blocker.rs under cfg(test),
    # so a lib-test build from vendored bytes is structurally impossible
    # (run 34717146412 job 103616322631 proved it; the step had never
    # executed before P11-T5 because phase 1 reddened first). Upstream
    # conformance is T8's parity job against the vendored corpus
    # (research-log-P11.md R2 addendum + D7 item 14).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain versions (recorded for research item 8)
        run: |
          cargo --version || echo "SKIP: cargo absent on this runner image"
          rustc --version || echo "SKIP: rustc absent on this runner image"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Vendor tree integrity (offline verifier)
        run: python3 tools/vendor_check.py --check
      - name: Offline closure build (consumed features, lock-free resolve, grep-verified)
        # T8 DEBT FIX (run 34758097067 surfaced it): this step used to be
        # `cargo build --offline` in the sealed crate dir, piped to tee
        # under the default `bash -e` shell — NO pipefail, so cargo's exit
        # code was swallowed. The step had been resolving RED since the T5
        # lock commit: the full upstream Cargo.lock demands the
        # css-validation subtree (cssparser/selectors) the 59-crate closure
        # deliberately excludes (consumed features only — PROVENANCE.md
        # boundary). Runs 34723790851/34726853499 therefore did NOT prove
        # an offline build; nothing cited them as one in an evidence row.
        # Corrected claim: the CONSUMED closure resolves + compiles offline
        # from the sealed vendor dir — a lock-free resolve in an in-tree
        # copy (keeps the third_party/rust/.cargo source-replacement
        # discovery; the committed lock stays hash-verified by vendor_check
        # and exercised by the --locked copy build below). The validator is
        # grep on "Finished" — never the pipe's exit code.
        run: |
          rm -rf ../xr-core/third_party/rust/.offline-proof
          cp -r ../xr-core/third_party/rust/adblock/0.13.3 ../xr-core/third_party/rust/.offline-proof
          rm ../xr-core/third_party/rust/.offline-proof/Cargo.lock
          cd ../xr-core/third_party/rust/.offline-proof
          cargo build --offline --release --no-default-features \
            --features embedded-domain-resolver,full-regex-handling,resource-assembler \
            2>&1 | tee /tmp/shield-vendor-build.log
          grep -q "Finished" /tmp/shield-vendor-build.log
          cd .. && rm -rf .offline-proof
      - name: Lock-resolving release build from a byte-identical copy (runner-side fetch, --locked)
        run: |
          cp -r ../xr-core/third_party/rust/adblock/0.13.3 /tmp/adblock-test
          cd /tmp/adblock-test
          cargo build --locked --release 2>&1 | tee /tmp/shield-vendor-test.log
          grep -q "Finished" /tmp/shield-vendor-test.log
      # P11-T8: the shim's FIRST compilation happens here (hosted lane by
      # law — no local cargo build exists or is claimed; lib.rs cites the
      # vendored API path:line it was written against). Then the REAL
      # engine product path rides the >=50k-decision bench (the plan's
      # floor; the sandbox lane's fake-engine rows are record-only) and
      # the parity corpus (>=1,500 cases, bands enforced). Rig class of a
      # hosted GitHub runner is TREND — the <=1ms filter-decision budget
      # is a trend-class row, so perf_gate may rule MET here; the
      # reference-class certification (calibrated rig, <=80MB memory row)
      # stays a farm-lane NOT-RUN (docs/qa/browser-harness.md).
      - name: Build the shield/engine FFI shim (cdylib, offline, source-replaced)
        run: |
          cd ../xr-core/shield/engine
          cargo build --release --offline 2>&1 | tee /tmp/shield-shim-build.log
          grep -q "Finished" /tmp/shield-shim-build.log
          test -f target/release/libxr_shield_engine.so
      - name: Real-engine shield bench (>=50k decisions, trend-class hosted rig)
        run: |
          python3 build/qa/perf/shield_bench.py --repo . --xr-core ../xr-core \
            --engine real --shim-dir ../xr-core/shield/engine/target/release \
            --json 2>&1 | tee /tmp/shield-bench-real.log
          tail -1 /tmp/shield-bench-real.log > /tmp/shield-bench-real.json
          python3 -c "import json; d=json.load(open('/tmp/shield-bench-real.json')); assert d['rows'], 'no rows'"
          python3 tools/perf_gate.py --repo . --bench /tmp/shield-bench-real.json --check --as-of 2026-09-10
      - name: Real-engine parity (vendored corpus vs the shim, bands enforced)
        run: |
          python3 tools/shield_parity.py --core ../xr-core --engine real \
            --shim ../xr-core/shield/engine/target/release/libxr_shield_engine.so \
            --check 2>&1 | tee /tmp/shield-parity-real.log
      - name: Post the conclusion
        if: always()
        run: |
          {
            echo "## shield-vendor (P11-T1/T7/T8)"
            echo "- vendored pin: adblock 0.13.3 (crate sha256 f44b96a6…)"
            echo "- offline closure build: $(grep -h 'Finished' /tmp/shield-vendor-build.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- copy build (--locked, release): $(grep -h 'Finished' /tmp/shield-vendor-test.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- shim cdylib build: $(grep -h 'Finished' /tmp/shield-shim-build.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- real-engine bench: $(grep -h 'decision ms' /tmp/shield-bench-real.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- real-engine parity: $(grep -h 'shield_parity' /tmp/shield-parity-real.log 2>/dev/null | head -1 || echo not-reached)"
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-fleet:
    # One fleet lane per target (parallel matrix; the tool's 600 s/target
    # law is unchanged — serial 4x600 in one job kept getting cancelled
    # ~30 min in, and each target is independently evidenced this way).
    strategy:
      matrix:
        target: [policy-core, commands-core, settings-core, themes-core]
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned PyYAML (hosted python carries none; tools/DEPS.md pin)
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Build the target's host binaries at the pin
        run: |
          make -C ../xr-core/policy/tests build
          make -C ../xr-core/commands/tests build
          make -C ../xr-core/settings/tests build
          make -C ../xr-core/themes/tests build
      - name: Fuzz timebox (600 s, ${{ matrix.target }})
        run: |
          python3 tools/fuzz_fleet.py --repo . --timebox 600 --seed 20260911 \
            --only ${{ matrix.target }} --json > /tmp/fuzz-fleet.json
          cat /tmp/fuzz-fleet.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/fuzz-fleet.json"))
          assert r["status"] == "pass", r
          assert r["results"] and all(x["rc"] == 0 for x in r["results"]), r
          EOF

  lane-health:
    # P11-T0-c: the fleet-wide scheduled-lane check. No other job in this
    # workflow installs Python deps (they run g++/make directly), so this
    # gets its own minimal job: checkout + pinned Python + PyYAML (via the
    # hash-pinned requirements-dev) + the check. A red scheduled lane
    # ANYWHERE in the fleet reddens this job within a day; exit 77
    # (api.github.com unreachable) is a VISIBLE SKIP per the skip-policy.
    name: scheduled-lane health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout xr-browser
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: python -m pip install --require-hashes -r tools/requirements-dev.txt

      - name: Scheduled-lane health (a red nightly reddens within a day)
        run: |
          python3 tools/scheduled_lane_check.py --own-lane core-hardening.yml; rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "SKIP: api.github.com unreachable/rate-limited from this runner — visible SKIP; governance re-checks on every push"
            exit 0
          fi
          exit "$rc"
