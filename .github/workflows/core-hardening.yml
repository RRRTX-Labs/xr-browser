name: core-hardening

# P10-T0-c: mutation + fuzz coverage for ALL FOUR C++ cores.
#
# Why this is a second workflow and not three more governance steps: the
# governance job already carries ~35 min of gates inside a 45-min timeout
# (the P9 budget math; see governance.yml). Adding three sampled mutation
# timeboxes (900 s each) plus a 600 s fuzz fleet would push the sum past any
# honest timeout, and trimming a timebox or a sample to fit is exactly the
# "weaken a gate to keep a lane green" move this repo refuses. So: the
# per-core lanes run here, in parallel jobs, on the pushes that can actually
# change a core (xr-core pin bumps, mutation/fuzz machinery) and weekly, so
# drift is caught even without a touching PR. Policy's lanes stay in
# governance where P6/P8 put them — nothing moved, nothing trimmed.
#
# Runner capability note (P10 research item 8): ubuntu-latest ships a Rust
# and Go toolchain; this workflow needs only python3 + g++ + make, which the
# setup-python action and the image provide.

on:
  push:
    branches: [main]
    paths:
      - "DEPS"
      - "tools/mutation_test.py"
      - "tools/fuzz_fleet.py"
      - "tools/policy_fuzz.py"
      - "tools/mutation_freshness.py"
      - ".github/workflows/core-hardening.yml"
  pull_request:
    paths:
      - "DEPS"
      - "tools/mutation_test.py"
      - "tools/fuzz_fleet.py"
      - "tools/policy_fuzz.py"
      - "tools/mutation_freshness.py"
      - ".github/workflows/core-hardening.yml"
  schedule:
    # weekly, 03:23 UTC Wednesdays — off the :00 stampede
    - cron: "23 3 * * 3"
  workflow_dispatch:

concurrency:
  group: core-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    # The staleness gate first: if a recorded score no longer covers the
    # pin, the per-core jobs below are what re-arms it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Mutation freshness gate
        run: |
          python3 tools/mutation_freshness.py --repo .

  mutation-commands:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # serial fleet: 5 targets x 600 s + four make builds + asserts
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Commands mutation gate (sampled; full = HG-28 farm)
        run: |
          python3 tools/mutation_test.py --targets commands --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 90 --json \
            > /tmp/mutation-commands.json
          cat /tmp/mutation-commands.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-commands.json"))
          assert r["gate"] == "PASS", f"commands mutation gate FAIL: {r['score_pct']}%"
          EOF

  mutation-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Settings mutation gate (sampled; full = HG-28 farm)
        run: |
          python3 tools/mutation_test.py --targets settings --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 90 --json \
            > /tmp/mutation-settings.json
          cat /tmp/mutation-settings.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-settings.json"))
          assert r["gate"] == "PASS", f"settings mutation gate FAIL: {r['score_pct']}%"
          EOF

  mutation-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Themes mutation gate (sampled at the P8 gate, >=95)
        run: |
          python3 tools/mutation_test.py --targets themes --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 95 --json \
            > /tmp/mutation-themes.json
          cat /tmp/mutation-themes.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-themes.json"))
          assert r["gate"] == "PASS", f"themes mutation gate FAIL: {r['score_pct']}% (< 95)"
          EOF

  mutation-update:
    # P10-T1 hard gate: the update verifier core at >=95% killed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Update mutation gate (sampled; >=95 = the T1 hard gate)
        run: |
          python3 tools/mutation_test.py --targets update --sample 90 \
            --seed 20260911 --timebox 900 --jobs 2 --score-gate 95 --json \
            > /tmp/mutation-update.json
          cat /tmp/mutation-update.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/mutation-update.json"))
          assert r["gate"] == "PASS", f"update mutation gate FAIL: {r['score_pct']}% (< 95)"
          EOF

  server-conformance:
    # P10-T2: the Rust deployable replays the committed corpus byte-exactly
    # (the reference half runs in governance here; no divergence is allowed).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain versions (recorded for research item 8)
        run: |
          cargo --version || echo "SKIP: cargo absent on this runner image"
          rustc --version || echo "SKIP: rustc absent on this runner image"
      - name: Rust conformance (byte parity with the reference corpus)
        run: |
          # P12-T0-c: the whole result is asserted, not a substring any single
          # success can satisfy. cargo prints ONE `test result:` line PER
          # SUITE, so `grep -q "test result: ok"` was satisfiable by a job in
          # which 3 of 4 suites failed — and without pipefail the pipe's exit
          # status was tee's, not cargo's, so the failure was discarded
          # outright. Both holes are closed: pipefail propagates cargo's real
          # status, and the suite count is compared against the expected
          # number so a vanished/extra suite reddens too.
          set -euo pipefail
          cd release/server/rust
          cargo test --locked 2>&1 | tee /tmp/rust-conformance.log
          grep -q "test result: ok" /tmp/rust-conformance.log
          ! grep -q "test result: FAILED" /tmp/rust-conformance.log
          SUITES=$(grep -c "^test result:" /tmp/rust-conformance.log)
          EXPECTED_SUITES=1
          echo "cargo suites reporting a result: $SUITES (expected $EXPECTED_SUITES)"
          test "$SUITES" -eq "$EXPECTED_SUITES"

  shield-vendor:
    # P11-T1: the vendored adblock-rust pin is REAL — it compiles offline
    # from the sha256-sealed tree, and the copy builds with the lock
    # resolved runner-side. Template: P10's server-conformance job.
    # Two-phase on purpose:
    #   build  = OFFLINE against third_party/rust/vendor/ (source
    #            replacement): the shim-root cargo build resolves and
    #            compiles the CONSUMED 59-crate closure with no network —
    #            grep-verified, never pipe-exit-verified (the T8 debt fix
    #            after run 34758097067 found the old step pipe-masked and
    #            red since the T5 lock commit);
    #   copy   = from a byte-identical COPY (MANIFEST-sealed) with a
    #            runner-side cargo fetch (--locked, release): the vendored
    #            layout deliberately excludes the ~150-crate dev-dep graph
    #            (PROVENANCE.md records the boundary), and the in-tree
    #            source replacement would block dev-dep fetches anyway.
    # NOT `cargo test`: the published .crate tarball carries no upstream
    # test tree — cargo strips tests/ at publish time, and adblock's
    # src/blocker.rs:536 includes ../tests/unit/blocker.rs under cfg(test),
    # so a lib-test build from vendored bytes is structurally impossible
    # (run 34717146412 job 103616322631 proved it; the step had never
    # executed before P11-T5 because phase 1 reddened first). Upstream
    # conformance is T8's parity job against the vendored corpus
    # (research-log-P11.md R2 addendum + D7 item 14).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain versions (recorded for research item 8)
        run: |
          cargo --version || echo "SKIP: cargo absent on this runner image"
          rustc --version || echo "SKIP: rustc absent on this runner image"
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Vendor tree integrity (offline verifier)
        run: python3 tools/vendor_check.py --check
      - name: Lock-resolving release build from a byte-identical copy (runner-side fetch, --locked)
        run: |
          # P12-T0-c: pipefail + an explicit error hunt. `grep -q Finished`
          # alone could be satisfied by a line printed before the build died.
          set -euo pipefail
          cp -r ../xr-core/third_party/rust/adblock/0.13.3 /tmp/adblock-test
          cd /tmp/adblock-test
          cargo build --locked --release 2>&1 | tee /tmp/shield-vendor-test.log
          grep -q "Finished" /tmp/shield-vendor-test.log
          ! grep -qE "^error(\[|:)" /tmp/shield-vendor-test.log
      # P11-T8: the shim's FIRST compilation happens here (hosted lane by
      # law — no local cargo build exists or is claimed; lib.rs cites the
      # vendored API path:line it was written against). This step is also
      # THE offline-closure proof: the shim root resolves the consumed
      # 59-crate closure from the sealed vendor dir with no network (a
      # standalone adblock-root offline build cannot serve: cargo resolves
      # the ROOT's optional deps — cssparser/selectors — even unactivated,
      # and the css-validation subtree is deliberately outside the closure;
      # runs 34758097067/34758551861 proved both halves). Then the REAL
      # engine product path rides the >=50k-decision bench (the plan's
      # floor; the sandbox lane's fake-engine rows are record-only) and
      # the parity corpus (>=1,500 cases, bands enforced). Rig class of a
      # hosted GitHub runner is TREND — the <=1ms filter-decision budget
      # is a trend-class row, so perf_gate may rule MET here; the
      # reference-class certification (calibrated rig, <=80MB memory row)
      # stays a farm-lane NOT-RUN (docs/qa/browser-harness.md).
      - name: Offline closure build = the FFI shim (cdylib, source-replaced, grep-verified)
        run: |
          # P12-T0-c: pipefail + an explicit error hunt (see the copy build).
          set -euo pipefail
          cd ../xr-core/shield/engine
          cargo build --release --offline 2>&1 | tee /tmp/shield-shim-build.log
          grep -q "Finished" /tmp/shield-shim-build.log
          ! grep -qE "^error(\[|:)" /tmp/shield-shim-build.log
          test -f target/release/libxr_shield_engine.so
      - name: Real-engine shield bench (>=50k decisions, trend-class hosted rig)
        run: |
          # P12-T0-c: pipefail so the bench's own exit status is not replaced
          # by tee's; the JSON `assert` below is the negative assertion.
          set -euo pipefail
          python3 build/qa/perf/shield_bench.py --repo . --xr-core ../xr-core \
            --engine real --shim-dir ../xr-core/shield/engine/target/release \
            --json 2>&1 | tee /tmp/shield-bench-real.log
          tail -1 /tmp/shield-bench-real.log > /tmp/shield-bench-real.json
          python3 -c "import json; d=json.load(open('/tmp/shield-bench-real.json')); assert d['rows'], 'no rows'"
          # Verdicts render to a TEMP report. The committed
          # docs/state/perf-budgets.md is the sandbox trend-lane artifact and
          # is drift-checked (perf_gate --check) by run_checks against the
          # SANDBOX bench only: runner-rig rows must never rewrite it or
          # drift-fail against it (different rig, values differ by design).
          python3 tools/perf_gate.py --repo . --bench /tmp/shield-bench-real.json \
            --report-md /tmp/perf-budgets-real.md --as-of 2026-09-10
          # Headline assertion (a trend-class runner rig MAY rule MET):
          # filter_decision_p99_ms (<=1 ms) and list_apply_ms (<=1500 ms)
          # must carry verdict MET here; NEUTRAL/MISSED/RECORD-ONLY on a
          # headline row fails the lane. Reference-class certification
          # (calibrated rig, memory_default_mb <=80 MB) stays the farm lane
          # NOT-RUN (HG-31, docs/qa/browser-harness.md).
          python3 - <<'PY'
          import pathlib
          md = pathlib.Path('/tmp/perf-budgets-real.md').read_text(encoding='utf-8')
          for metric in ('filter_decision_p99_ms', 'list_apply_ms'):
              row = next(l for l in md.splitlines()
                         if l.startswith(f'| {metric} |'))
              verdict = [c.strip() for c in row.split('|')][5]
              assert verdict == 'MET', \
                  f'{metric}: verdict {verdict} (headline row must be MET)'
              print(f'PASS: {metric} verdict MET (hosted trend rig)')
          PY
          cat /tmp/perf-budgets-real.md
      # Unmask round 2 (the sweep the first unmask pass owed EVERY tee
      # step): this step was still a bare `cmd | tee` pipe, so run
      # 34765433794 went GREEN while the verdict inside was FAIL
      # (agreement 93.151% vs band >=98, FP 11.765% vs <=0.5, FN 21).
      # bash -e without pipefail takes tee's exit code — the verdict is
      # now grep-verified from the --json dump, and the dump carries
      # per-class counts + up to 200 mismatches so any future divergence
      # triages from ONE hosted round. The divergences that round found
      # are fixed (D-7/D-8/D-9, docs/shield/parity-divergences.md; the
      # v1 matcher aligned to the vendored engine at xr-core 866387a).
      - name: Real-engine parity (vendored corpus vs the shim, bands enforced)
        run: |
          # P12-T0-c: pipefail + a NEGATIVE verdict hunt. P11 already made
          # this step assert on `--check` and the PASS verdict; pipefail closes
          # the remaining hole where the tool's own non-zero exit was replaced
          # by tee's.
          set -euo pipefail
          python3 tools/shield_parity.py --core ../xr-core --engine real \
            --shim ../xr-core/shield/engine/target/release/libxr_shield_engine.so \
            --check --json 2>&1 | tee /tmp/shield-parity-real.json
          grep -q '"verdict": "PASS"' /tmp/shield-parity-real.json
          ! grep -q '"verdict": "FAIL"' /tmp/shield-parity-real.json
          python3 - <<'PY'
          import json
          line = next(l for l in open('/tmp/shield-parity-real.json')
                      if l.startswith('{'))
          r = json.loads(line)
          print(f"shield_parity (real): {r['cases']} cases — agreement "
                f"{r['action_agreement_pct']}% (band "
                f">={r['bands']['agreement_min_pct']}), FP "
                f"{r['false_positive_pct']}% (band "
                f"<={r['bands']['fp_max_pct']}), provenance "
                f"{r['provenance_agreement_pct']}%, FN "
                f"{r['false_negatives']} — {r['verdict']}")
          for m in r['mismatches'][:40]:
              print(' ', m['id'], f"[{m['class']}/{m['variant']}]", m['url'],
                    'expect', m['expect']['action'], 'got',
                    m['got']['action'])
          PY
      - name: Post the conclusion
        if: always()
        run: |
          {
            echo "## shield-vendor (P11-T1/T7/T8)"
            echo "- vendored pin: adblock 0.13.3 (crate sha256 f44b96a6…)"
            echo "- offline closure build (shim root): $(grep -h 'Finished' /tmp/shield-shim-build.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- copy build (--locked, release): $(grep -h 'Finished' /tmp/shield-vendor-test.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- shim cdylib build: $(grep -h 'Finished' /tmp/shield-shim-build.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- real-engine bench: $(grep -h 'decision ms' /tmp/shield-bench-real.log 2>/dev/null | head -1 || echo not-reached)"
            echo "- real-engine parity: $(grep -ho '"verdict": "[A-Z]*"' /tmp/shield-parity-real.json 2>/dev/null | head -1 || echo not-reached) (full JSON report in the step log)"
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-fleet:
    # One fleet lane per target (parallel matrix; the tool's 600 s/target
    # law is unchanged — serial 5x600 in one job kept getting cancelled
    # ~30 min in, and each target is independently evidenced this way).
    strategy:
      matrix:
        target: [policy-core, commands-core, settings-core, themes-core, cosmetic-core]
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned PyYAML (hosted python carries none; tools/DEPS.md pin)
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Checkout xr-core at the DEPS pin
        run: |
          XR_CORE_REV="$(sed -n 's/^xr_core_rev: "\([0-9a-f]\{40\}\)".*/\1/p' DEPS)"
          git clone --quiet https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout --quiet "$XR_CORE_REV"
      - name: Build the target's host binaries at the pin
        run: |
          make -C ../xr-core/policy/tests build
          make -C ../xr-core/commands/tests build
          make -C ../xr-core/settings/tests build
          make -C ../xr-core/themes/tests build
          make -C ../xr-core/renderer/cosmetic/tests build
      - name: Fuzz timebox (600 s, ${{ matrix.target }})
        run: |
          python3 tools/fuzz_fleet.py --repo . --timebox 600 --seed 20260911 \
            --only ${{ matrix.target }} --json > /tmp/fuzz-fleet.json
          cat /tmp/fuzz-fleet.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/fuzz-fleet.json"))
          assert r["status"] == "pass", r
          assert r["results"] and all(x["rc"] == 0 for x in r["results"]), r
          EOF

  snapshot-freshness:
    # P12-T0-a: freshness is a SCHEDULED-lane concern, not a push-gate one.
    # Before this change the release-notes snapshot's age reddened the push
    # gate every calendar day (a check whose verdict moves while the tree is
    # unchanged is not a gate). The push gate now renders from the committed
    # snapshot with a pinned --as-of and is byte-deterministic; THIS lane owns
    # the opposite question — "is the snapshot old enough to re-fetch?" — in
    # the STALE-* shape tools/scheduled_lane_check.py already established:
    # visible, non-fatal to any push gate, never counted green. A red here
    # means "refresh the fixture", and lane-health surfaces it fleet-wide
    # within a day.
    name: snapshot freshness (STALE-* visible, non-fatal to push gates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout xr-browser
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: python -m pip install --require-hashes -r tools/requirements-dev.txt

      - name: Release-notes snapshot age vs the 30-day refresh budget
        run: |
          # The clock lives in the SHELL here, never in a Python verdict, so
          # tools/wall_clock_lint.py stays honest about what it proves.
          python3 tools/release_notes.py --train 152 \
            --fixture tools/fixtures/release-notes-train-152.json \
            --out release/notes/train-152.md --check \
            --as-of "$(date -u +%F)" --max-age-days 30; rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "PASS: release-notes snapshot inside the 30-day refresh budget"
          else
            echo "STALE-FAIL: refresh tools/fixtures/release-notes-train-152.json against the live choke point, then re-commit release/notes/train-152.md. Non-fatal to every push gate by design; never counted green."
          fi
          exit "$rc"

  lane-health:
    # P11-T0-c: the fleet-wide scheduled-lane check. No other job in this
    # workflow installs Python deps (they run g++/make directly), so this
    # gets its own minimal job: checkout + pinned Python + PyYAML (via the
    # hash-pinned requirements-dev) + the check. A red scheduled lane
    # ANYWHERE in the fleet reddens this job within a day; exit 77
    # (api.github.com unreachable) is a VISIBLE SKIP per the skip-policy.
    name: scheduled-lane health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout xr-browser
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: python -m pip install --require-hashes -r tools/requirements-dev.txt

      - name: Scheduled-lane health (a red nightly reddens within a day)
        run: |
          python3 tools/scheduled_lane_check.py --own-lane core-hardening.yml; rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "SKIP: api.github.com unreachable/rate-limited from this runner — visible SKIP; governance re-checks on every push"
            exit 0
          fi
          exit "$rc"
