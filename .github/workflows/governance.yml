name: governance

# Plan P1: "CI from commit 1" — the governance gate runs on every push and
# pull request: plan pin, registry drift, decision register + trailers,
# license, DCO, threat model, banned vocabulary, CODEOWNERS sync, tests,
# and the negative fixtures that prove the gates fail correctly.
#
# Action pins: full-SHA, no floating tags (supply chain discipline, plan
# §9.11 / §13). Pinned 2026-09-07:
#   actions/checkout@v4.4.0   = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python@v5.6.0 = a26af69be951a213d495a4c3e4e4022e16d87065
#
# Note for P1: this repo has no GitHub remote yet, so this workflow is the
# committed definition of the gate; the equivalent runs are executed
# locally (tools/run_checks.sh, tools/run_negatives.sh) and logged in
# evidence/P1/. GitHub-side runs become active when the remote is created
# (human-gated, HG-8).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # dco_check and the Register-Change trailer check need the
          # commits being reviewed; fetch full history so PR ranges resolve.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --require-hashes -r tools/requirements-dev.txt

      - name: Install optional helper tools (P4-T0.1)
        # These are NOT repo dependencies (no pip, nothing vendored — see
        # docs/dependencies/helper-tools.yaml). Where they are absent the
        # dependent test SKIPs with a visible reason (L6); on CI we install
        # them so the lane exercises the real round-trip instead.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Checkout xr-core at the DEPS pin
        # P3 gates (budget / retirement-lint) read the sibling patch repo at
        # the pin recorded in DEPS (single source of truth).
        #
        # P4-T0.1: this URL was https://github.com/ahmadrrrtx/xr-core.git,
        # which is 404 for an unauthenticated runner (the org repo is
        # RRRTX-Labs/xr-core). Every hosted run failed here before this fix.
        run: |
          pin=$(grep -oP 'xr_core_rev: "\K[0-9a-f]{40}' DEPS)
          git clone -q https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout -q "$pin"
          git -C ../xr-core rev-parse HEAD

      - name: Cross-repo pin is alive (P4-T0.2)
        # DEPS.xr_core_rev must be a reachable ancestor of origin xr-core
        # main — otherwise every fresh clone (and this runner) is broken.
        # Unauthenticated, public remote only (docs/process/cross-repo-pin.md).
        run: ./scripts/build sync check-pin-alive --json

      - name: Governance checks
        # Concrete SHAs (always resolvable with fetch-depth: 0):
        #   PR  -> base.sha..HEAD   (only the PR's commits are gated)
        #   push-> before..HEAD     (empty on the very first push -> full history)
        env:
          CHECK_RANGE: ${{ github.event_name == 'pull_request' && (github.event.pull_request.base.sha + '..HEAD') || (github.event.before != '0000000000000000000000000000000000000000' && (github.event.before + '..HEAD') || '') }}
        run: |
          if [ -n "$CHECK_RANGE" ]; then
            echo "checking range: $CHECK_RANGE"
            tools/run_checks.sh "$CHECK_RANGE"
          else
            echo "checking full history"
            tools/run_checks.sh
          fi

      - name: Negative fixtures (gates must fail on bad input)
        run: tools/run_negatives.sh

      - name: Build-system gates (P2)
        run: |
          ./scripts/build test                                    # build + tools test suites
          python3 build/toolchain/provenance.py --verify # toolchain digests (R0)
          ./scripts/build brand-check --scan                       # endpoint-deny over the build surface
          python3 build/gn/resolve_args.py --validate   # argset allowlist consistency

      # ------------------------------------------------------------------
      # P3: upstream-treadmill gates. All offline (fixtures / committed
      # config); the live lanes run in nightly-rebase-build.yml instead.
      # ------------------------------------------------------------------
      - name: Upstream treadmill gates (P3)
        run: |
          # patch budget: config must match the plan's §1.2 caps exactly...
          python3 build/upstream/gen_budget_config.py --check
          # ...the manifest must be under budget (blocking)...
          ./scripts/build budget --manifest ../xr-core/patches/manifest.yaml --gate
          # ...and the committed state doc must not be stale
          ./scripts/build budget --manifest ../xr-core/patches/manifest.yaml --check-state-doc
          # rebase engine: offline 5-patch classification drill (3 ranges)
          ./scripts/build rebase selftest
          # assumption registry: schema-valid before anything runs it live
          ./scripts/build assumptions validate
          # retirement ledger: linkage + removal-without-ledger detection
          # (xr-core at the DEPS pin; full history for the cross-check)
          ./scripts/build retire lint --xr-core ../xr-core
          # network chokepoint: all upstream fetches through fetch.py's allowlist
          python3 tools/fetch_allowlist_check.py
