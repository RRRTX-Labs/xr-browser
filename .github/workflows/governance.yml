name: governance

# Plan P1: "CI from commit 1" — the governance gate runs on every push and
# pull request: plan pin, registry drift, decision register + trailers,
# license, DCO, threat model, banned vocabulary, CODEOWNERS sync, tests,
# and the negative fixtures that prove the gates fail correctly.
#
# Action pins: full-SHA, no floating tags (supply chain discipline, plan
# §9.11 / §13). Pinned 2026-09-07:
#   actions/checkout@v4.4.0   = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python@v5.6.0 = a26af69be951a213d495a4c3e4e4022e16d87065
#
# Note for P1: this repo has no GitHub remote yet, so this workflow is the
# committed definition of the gate; the equivalent runs are executed
# locally (tools/run_checks.sh, tools/run_negatives.sh) and logged in
# evidence/P1/. GitHub-side runs become active when the remote is created
# (human-gated, HG-8).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Backstop for the whole gate suite. Post-P9 the steps sum to roughly
    # 13 min (governance: pytest + C++ lanes + differential fuzz 120s +
    # fuzz fleet 4x60s + T1-T12 gates) + 10 min (P6 fuzz timebox 600s) +
    # mutation sample (timebox 900) + build-system/contracts/treadmill, i.e.
    # ~35 min observed on a 2-core runner. 45 leaves headroom for
    # shared-runner variability without changing any gate.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # dco_check and the Register-Change trailer check need the
          # commits being reviewed; fetch full history so PR ranges resolve.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --require-hashes -r tools/requirements-dev.txt

      - name: Install optional helper tools (P4-T0.1)
        # These are NOT repo dependencies (no pip, nothing vendored — see
        # docs/dependencies/helper-tools.yaml). Where they are absent the
        # dependent test SKIPs with a visible reason (L6); on CI we install
        # them so the lane exercises the real round-trip instead.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v
          # actionlint: GitHub's own checker for workflow expressions and
          # schema. Pinned by version AND release-tarball sha256 — the same
          # supply-chain discipline as the hash-pinned actions above. It is
          # what found the defect that had silently killed every hosted run in
          # this repo: a `+` inside an expression, which GitHub rejects at
          # compile time, producing a run with zero jobs and no logs.
          AL_VERSION=1.7.7
          AL_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -version

      - name: Checkout xr-core at the DEPS pin
        # P3 gates (budget / retirement-lint) read the sibling patch repo at
        # the pin recorded in DEPS (single source of truth).
        #
        # P4-T0.1: this URL was https://github.com/ahmadrrrtx/xr-core.git,
        # which is 404 for an unauthenticated runner (the org repo is
        # RRRTX-Labs/xr-core). Every hosted run failed here before this fix.
        run: |
          pin=$(grep -oP 'xr_core_rev: "\K[0-9a-f]{40}' DEPS)
          git clone -q https://github.com/RRRTX-Labs/xr-core.git ../xr-core
          git -C ../xr-core checkout -q "$pin"
          git -C ../xr-core rev-parse HEAD

      - name: Cross-repo pin is alive (P4-T0.2)
        # DEPS.xr_core_rev must be a reachable ancestor of origin xr-core
        # main — otherwise every fresh clone (and this runner) is broken.
        # Unauthenticated, public remote only (docs/process/cross-repo-pin.md).
        run: ./scripts/build sync check-pin-alive --json

      - name: Governance checks
        # Concrete SHAs (always resolvable with fetch-depth: 0):
        #   PR  -> base.sha..HEAD   (only the PR's commits are gated)
        #   push-> before..HEAD     (empty on the very first push -> full history)
        env:
          # GitHub expressions have no `+` operator; string building is
          # format(). A lex error here is fatal at *compile* time: the run
          # fails with zero jobs, which is why every push run in this repo
          # failed before any step executed (caught by actionlint, P4).
          CHECK_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..HEAD', github.event.before) || '') }}
        run: |
          if [ -n "$CHECK_RANGE" ]; then
            echo "checking range: $CHECK_RANGE"
            tools/run_checks.sh "$CHECK_RANGE"
          else
            echo "checking full history"
            tools/run_checks.sh
          fi

      - name: Workflow files lint (P4)
        # A workflow-expression compile error produces a run with ZERO jobs,
        # zero logs and zero check-runs. From the API it looks like a normal
        # failure, so this gate is the only place it is caught before GitHub.
        run: ./scripts/build workflow-lint

      - name: Negative fixtures (gates must fail on bad input)
        run: tools/run_negatives.sh

      - name: Build-system gates (P2)
        run: |
          ./scripts/build test                                    # build + tools test suites
          python3 build/toolchain/provenance.py --verify # toolchain digests (R0)
          ./scripts/build brand-check --scan                       # endpoint-deny over the build surface
          python3 build/gn/resolve_args.py --validate   # argset allowlist consistency

      # ------------------------------------------------------------------
      # P5: contract-freeze gates. Offline (mojom structural lint, §1.11
      # manifest, golden-vector fake parity, freeze register). The C++ mojom
      # bindings compile is farm-gated (HG-9/HG-27) and is NOT run here.
      # ------------------------------------------------------------------
      - name: Contract-freeze gates (P5)
        run: |
          ./scripts/build contracts all           # mojom_lint + manifest + vectors + freeze
          # fake-parity: golden vectors reproduced byte-for-byte by the fakes
          python3 tools/vectors_check.py --json > /dev/null
          # xrctl smoke: every interface returns a typed result
          python3 -m pytest docs/contracts/tests -q

      # ------------------------------------------------------------------
      # P6: policy-resolver gates. The C++ core builds and runs its full
      # suite here (runners have g++); mode_lint/policy.md/events schema
      # run inside run_checks.sh. Heavier lanes below: mutation (sampled,
      # deterministic seed; full matrix + 24h fuzz = HG-28 farm), fuzz
      # timebox, bench (record-only, budget verdicts text-checked).
      # ------------------------------------------------------------------
      - name: Mutation freshness gate (P10-T0-c — a stale score is a FAIL)
        run: |
          python3 tools/mutation_freshness.py --repo .

      - name: Policy mutation gate (P6, sampled; full = HG-28)
        run: |
          # Deterministic sample keeps CI time bounded (~10 min on 2 cores);
          # the score gate (>=90%) and deny-guard 100% apply to the sample.
          # evidence/P6/mutation-report.* records the full-matrix run.
          python3 tools/mutation_test.py --sample 90 --seed 20260908 \
            --timebox 900 --json > /tmp/mutation-ci.json
          cat /tmp/mutation-ci.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/mutation-ci.json"))
          assert r["gate"] == "PASS", f"mutation gate FAIL: score {r['score_pct']}%"
          assert r["deny_guard_survivors"] == 0, "deny-guard mutant survived"
          PY

      - name: Policy fuzz timebox (P6; 24h campaign = HG-28)
        run: |
          python3 tools/policy_fuzz.py --timebox 600 --seed 20260908 \
            --report /tmp/fuzz-ci.json --json
          cat /tmp/fuzz-ci.json

      - name: Policy bench (P6, record-only; budgets re-checked HG-28)
        run: |
          # The tests Makefile redirects bench_main's stdout into
          # build/bench-results.json (human table + canonical JSON), so the
          # verdicts are read from that file — piping `make bench` captures
          # nothing.
          make -C ../xr-core/policy/tests bench
          cat ../xr-core/policy/tests/build/bench-results.json
          # Record-only, but the verdicts must be present and honest
          # (MET or an explicit DEVIATION — never silent):
          grep -q "cold <=200us: MET\|cold <=200us: DEVIATION" \
            ../xr-core/policy/tests/build/bench-results.json
          grep -c "MET\|DEVIATION" ../xr-core/policy/tests/build/bench-results.json

      # ------------------------------------------------------------------
      # P3: upstream-treadmill gates. All offline (fixtures / committed
      # config); the live lanes run in nightly-rebase-build.yml instead.
      # ------------------------------------------------------------------
      - name: Upstream treadmill gates (P3)
        run: |
          # patch budget: config must match the plan's §1.2 caps exactly...
          python3 build/upstream/gen_budget_config.py --check
          # ...the manifest must be under budget (blocking)...
          ./scripts/build budget --manifest ../xr-core/patches/manifest.yaml --gate
          # ...and the committed state doc must not be stale
          ./scripts/build budget --manifest ../xr-core/patches/manifest.yaml --check-state-doc
          # rebase engine: offline 5-patch classification drill (3 ranges)
          ./scripts/build rebase selftest
          # assumption registry: schema-valid before anything runs it live
          ./scripts/build assumptions validate
          # retirement ledger: linkage + removal-without-ledger detection
          # (xr-core at the DEPS pin; full history for the cross-check)
          ./scripts/build retire lint --xr-core ../xr-core
          # network chokepoint: all upstream fetches through fetch.py's allowlist
          python3 tools/fetch_allowlist_check.py
