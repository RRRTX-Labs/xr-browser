# Dependency evaluation: helper tooling (PyYAML, jsonschema, pytest)
project: "PyYAML — https://pypi.org/project/PyYAML/ · jsonschema — https://pypi.org/project/jsonschema/ · pytest — https://pypi.org/project/pytest/"
role: "DEV/CI-ONLY governance tooling (tools/*): YAML parse for registers/registries, JSON-Schema validation for evidence, test runner. NO runtime dependency of any kind; NO vendored third-party code in the product (Plan P1 scope rules, §8.9 'Python (tooling only, typed, pinned)')"
plan_refs: ["P1-T8/T9/T10/T13", "§8.9", "L9"]
current_status: "all three actively maintained at evaluation (2026-09-07); pinned versions in tools/requirements-dev.txt with sha256 hashes (CI installs with --require-hashes)"
version_pin_policy: "exact version + sha256 per file in tools/requirements-dev.txt; pip install --require-hashes in CI (governance.yml); no transitive drift possible (transitive deps pinned too)"
licenses:
  code: "MIT (all three — verified via PyPI metadata at evaluation; permissive, non-copyleft ✓)"
  data: "—"
health:
  last_release: "PyYAML 6.0.3 · jsonschema 4.26.0 · pytest 9.0.3 (pinned set, all current at 2026-09-07)"
  bus_factor: "all three are infrastructure-grade projects with large maintainer bases (PyYAML: a few maintainers but 20-year track record; jsonschema: PyCDA/multi; pytest: core team)"
  open_critical_advisories: "none found as of 2026-09-07 for the pinned set"
security_posture: "supply chain: pinned hashes mean the exact audited artifact installs (a PyPI compromise of a different file fails the hash check); these run on CI/developers only, never in the browser or a shipped artifact; jsonschema validates OUR evidence format (defense against malformed DoD records), pytest runs the canary-negative suites (L8)"
maintenance_burden: "minimal: three pins, stdlib-first tools around them; a bump is a one-line PR + hash refresh"
link_policy: "permissive — MIT (DR-04 satisfied); and they are dev-only, so the link question doesn't arise for shipped binaries"
use_verdict: "USE (dev/CI-only)"
alternatives_rejected:
  - "hand-rolled YAML parsing: fail-closed correctness + standard conformance matter for the registers (a malformed decisions.yaml must fail loudly, not parse ambiguously) — PyYAML safe_load is the boring correct choice"
  - "other test frameworks: pytest is the de-facto standard and the Plan's test-plan assumes it"
exit_plan: "replaceable one-for-one (any YAML parser / schema validator / test runner behind the same CLI interfaces in tools/*); dev-only, so an exit costs a tooling PR, not a product change"
owner: "A lead (Platform/Chromium) — tooling track"
evaluated_on: 2026-09-07
refresh_by: 2026-12-06
sources:
  - url: "https://pypi.org/project/PyYAML/"
    accessed: 2026-09-07
    quote: "PyPI metadata: PyYAML 6.0.3, License: MIT"
  - url: "https://pypi.org/project/jsonschema/"
    accessed: 2026-09-07
    quote: "PyPI metadata: jsonschema 4.26.0, License: MIT"
  - url: "https://pypi.org/project/pytest/"
    accessed: 2026-09-07
    quote: "PyPI metadata: pytest 9.0.3, License: MIT"

# ---------------------------------------------------------------------------
# P4-T0.1 ADDENDUM — optional external helper tools (NOT vendored, NOT pip).
#
# These are OS/host tools that some build+test paths shell out to. They are
# deliberately NOT vendored (zero-new-dependency rule) and NOT required: any
# test that needs one SKIPS with a visible reason when it is absent
# (build/skip_policy.py, L6 — never a silent pass, never a deleted test).
#
# CI is the environment where they SHOULD be present: governance.yml installs
# them explicitly so the hosted lane exercises the full round-trip.
# ---------------------------------------------------------------------------
tools:
  - name: minisign
    role: "TEST-ONLY artifact signature in the P3 fast-lane drill (sign the fixture artifact with the TEST key material from build/signing/testkeys/). Never used for a release artifact: real HSM-backed signing lands P10 (ADR-0004)."
    required: false
    policy: "absent -> dependent test SKIPs with 'SKIP (tool absent: minisign)' (visible in the ./scripts/build test summary); present -> full round-trip runs"
    install_ci: "sudo apt-get update && sudo apt-get install -y minisign   # Ubuntu universe, 0.11-1 (noble)"
    install_dev: "apt-get install minisign | brew install minisign"
    license: "ISC (jedisct1/minisign) — permissive, non-copyleft; installed as an OS package, neither vendored nor linked"
    source_url: "https://github.com/jedisct1/minisign"
    rationale: "Adds zero repo dependencies (no pip, no vendored code, no build-graph change); the drill's cryptographic operation is real when the tool exists and visibly absent when it does not — never simulated. Alternative rejected: signing in pure Python would mean inventing/duplicating crypto primitives (forbidden by the phase rules); alternative rejected: deleting the sign step from the drill would hide a real P10 integration risk."
    owner: "E (Release engineering)"
    added_on: 2026-09-07
    added_by: "P4-T0.1 (self-containment debt D-A)"

  - name: codesign
    role: "macOS TEST signing passthrough (P2-T7 sign_artifact.py)"
    required: false
    policy: "absent -> SKIP visible; macOS runners provide it"
    install_ci: "preinstalled on GitHub-hosted macos runners (Xcode CLT)"
    license: "Apple proprietary tooling, not distributed with this repo"
    rationale: "Platform tool; cannot be vendored. Test path only."
    owner: "E (Release engineering)"
    added_on: 2026-09-07
    added_by: "P4-T0.1"

  - name: signtool
    role: "Windows TEST signing passthrough (P2-T7 sign_artifact.py)"
    required: false
    policy: "absent -> SKIP visible; Windows runners provide it"
    install_ci: "preinstalled on GitHub-hosted windows runners (Windows SDK)"
    license: "Microsoft proprietary tooling, not distributed with this repo"
    rationale: "Platform tool; cannot be vendored. Test path only."
    owner: "E (Release engineering)"
    added_on: 2026-09-07
    added_by: "P4-T0.1"

  - name: actionlint
    role: "Deep lint of .github/workflows — GitHub Actions expression syntax and workflow schema (P4)."
    required: false
    policy: "absent -> build/workflow_lint.py still runs its always-on checks and prints 'SKIP (tool absent: actionlint)' for the deep pass (L6); present -> full actionlint findings are appended. A workflow expression lex error is fatal at compile time: GitHub fails the run with zero jobs, no logs and no check-runs, so it cannot be seen from the API side."
    install_ci: "pinned release tarball + sha256 (see governance.yml 'Install optional helper tools'); v1.7.7, sha256 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    install_dev: "same as CI, or: go install github.com/rhysd/actionlint/cmd/actionlint@latest"
    license: "MIT (rhysd/actionlint) — permissive, non-copyleft; a CI-only binary, neither vendored nor linked"
    source_url: "https://github.com/rhysd/actionlint"
    rationale: "Found the defect that had silently disabled this repo's governance CI since P1 (`github.event.pull_request.base.sha + '..HEAD'` — GitHub expressions have no `+` operator). Nothing in tools/ or build/ parsed workflow expressions, so run_checks.sh stayed green while every hosted run died before job creation. Alternative rejected: hand-rolling an Actions-expression parser (large, and would drift from GitHub's); alternative rejected: relying on GitHub's own error surface (there is none — zero jobs, zero logs)."
    owner: "E (Release engineering)"
    added_on: 2026-09-07
    added_by: "P4 (hosted-CI root cause)"
