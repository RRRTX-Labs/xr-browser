plan_refs: ["§1.7", "§8.4", "DR-30", "R10", "P28-T1"]
current_status: "actively maintained: crate `keepass` max-stable 0.13.25, updated 2026-08-30 (crates.io, live-verified) — note: Plan Appendix A recorded 0.13.6 at reconciliation; same 0.13.x line, still active, write-path caveat unchanged (see sources)"
version_pin_policy: "vendored + pinned exact git revision (cargo_crate pattern) in P28's DEPS; `cargo vet` audited-diff on every pin bump; advisory review SLA 72h for criticals (Plan §9.5)"
