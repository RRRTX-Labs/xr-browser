security_posture: "parser of hostile input (user vault files + imported KDBX) — fuzz target required (P28-T9, 7-day clean floor); MIT + active + co-owned = acceptable; but the WRITE path is the risk: upstream labels KDBX4.1 writing experimental and fork-lineage docs warn unparsed fields are lost on save (Plan R10) — therefore reader-only for us"
maintenance_burden: "low: stable 0.13.x API for reading; no rebase cost (vendored)"
link_policy: "permissive — MIT, linkable (DR-04 satisfied). The banned sibling `kdbx-rs` (GPL-3) remains banned (Plan R10/§8.4)"
use_verdict: "INTEGRATE — reader YES, writer NO (DR-30: XR owns the writer behind the golden-fidelity corpus, P28)"
alternatives_rejected:
  - "kdbx-rs: GPL-3.0 — banned as linked code (DR-04, Plan R10)"
  - "KeePassXC code reuse: GPL-3.0 — study architectures only, no copying (Plan §8.4)"
  - "XR writes the reader too: unnecessary duplication of a well-tested parser; the writer is where fidelity risk lives, and that is XR-owned regardless"
exit_plan: "reader is a pure function of a pinned revision: if keepass-rs stalls, the reader is small enough to fork (MIT) behind the same crate interface; the writer is ours, so vault capability never depends on this project's health beyond parse compatibility (golden corpus pins interop)"
