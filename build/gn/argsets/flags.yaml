# flags.yaml — the argsets allowlist (single source of truth for shipped GN args).
#
# Consumed by resolve_args.py. Every flag shipped in an argset MUST have an
# entry here (or be XR-owned with an `xr_` prefix). A flag absent from this
# allowlist fails CI (`./scripts/build gen --validate`) — the negative test that keeps
# the argsets honest. `read_at` cites the pinned Chromium rev
# (d04cdb24d67b081f6cf80200ffc5233f44b61109, 152.0.7977.82).
#
# kind: chromium = read at the cited file:line in the pin; xr = XR-owned
# (public API per Plan P2 "GN arg names become public API").

schema_version: 1
pin: "d04cdb24d67b081f6cf80200ffc5233f44b61109"
flags:
  # -- XR-owned (documented public API; no chromium read site) --
  xr_branding:
    kind: xr
    note: "De-Google branding on/off. Maps to Chromium branding (Chromium, not Chrome) — see argsets/README.md."
  xr_channel:
    kind: xr
    note: "dev | beta | stable. Consumed by branding/gen_version.py (version string builder)."
  # -- Chromium flags (read-at cited in the pinned rev) --
  enable_widevine:
    kind: chromium
    read_at: "third_party/widevine/cdm/widevine.gni:14-20"
    note: "DR-14 OPEN / LG-3. Default false unless chrome-branded; we keep false. Flipping requires a counsel verdict + register change — no hidden path (Plan P2 security req)."
  safe_browsing_mode:
    kind: chromium
    read_at: "chrome/common/BUILD.gn:407,759 (declared in components/safe_browsing/buildflags.gni, imported at chrome/common/features.gni:10)"
    note: "0 = no safe-browsing code paths. SB re-architecture is P16 (DR-15)."
  google_api_key:
    kind: chromium
    read_at: "google_apis/BUILD.gn:25"
    note: "Empty string = no Google API key compiled in (L16)."
  google_default_client_id:
    kind: chromium
    read_at: "google_apis/BUILD.gn:28"
    note: "Empty = no default client id."
  google_default_client_secret:
    kind: chromium
    read_at: "google_apis/BUILD.gn:31"
    note: "Empty = no default client secret."
  use_official_google_api_keys:
    kind: chromium
    read_at: "google_apis/BUILD.gn:34"
    note: "Empty string = do not use official (internal) keys."
  exclude_unwind_tables:
    kind: chromium
    read_at: "build/config/compiler/BUILD.gn:495"
    note: "false = keep unwind tables (we do not shrink frames; plan P2-T2 lists it explicitly)."
  is_official_build:
    kind: chromium
    read_at: "build/config/BUILDCONFIG.gn:125-136"
    note: "Optimization tier above release; use for any build intended to ship."
  is_debug:
    kind: chromium
    read_at: "build/config/BUILDCONFIG.gn:158-160"
    note: "Debug build; official builds force it false."
  is_component_build:
    kind: chromium
    read_at: "build/config/BUILDCONFIG.gn:163-171"
    note: "Component (shared-library) build; helper lanes only (fast iteration)."
  symbol_level:
    kind: chromium
    read_at: "build/config/compiler/BUILD.gn:1423,3114-3118"
    note: "0 = none, 1 = minimal, 2 = full debug info."
  dcheck_always_on:
    kind: chromium
    read_at: "build/config/compiler/BUILD.gn:153 (import build/config/dcheck_always_on.gni at :17)"
    note: "Keep DCHECKs in non-official builds."
