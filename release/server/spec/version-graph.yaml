# release/server/spec/version-graph.yaml — the language-neutral version
# graph (P10-T2). Consumed by refimpl/update_server_ref.py AND
# release/server/rust/ (the deployable). Validated by:
#   tools/xr_schema.py validate server-version-graph <this file>
schema: xr-server-version-graph
schema_version: 1
# The graph is LINEAR per channel (no branches): an entry is either the
# channel head or an ancestor. The server offers the head; it never offers
# an ancestor (the client would refuse it as a downgrade anyway — the
# monotonic law is enforced on both sides).
channels:
