      version: "0.9.22.1"
      hash_sha256: "1111111111111111111111111111111111111111111111111111111111111111"
      size: 88080384
      url: "https://updates.rrrtx.labs/nightly/xr-0.9.22.1"
    ancestors:
      - version: "0.9.21.0"
        hash_sha256: "2222222222222222222222222222222222222222222222222222222222222222"
        size: 87920256
        url: "https://updates.rrrtx.labs/nightly/xr-0.9.21.0"
  beta:
    head:
      version: "0.9.20.5"
      hash_sha256: "3333333333333333333333333333333333333333333333333333333333333333"
      size: 88178176
      url: "https://updates.rrrtx.labs/beta/xr-0.9.20.5"
    ancestors: []
  stable:
